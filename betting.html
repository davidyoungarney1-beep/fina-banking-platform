<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083d2e"><title>Betting wallet | FINA</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="dashboard.css"><style>.service-page{max-width:720px;margin:28px auto 100px;padding:0 18px}.service-hero,.service-panel{background:#fff;border:1px solid #e4ece8;border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:0 8px 26px #092b1c0a}.service-hero{background:linear-gradient(135deg,#083d2e,#147a58);color:#fff}.service-hero h1{font:800 30px Manrope,sans-serif;margin:10px 0;color:#fff;letter-spacing:-1px}.service-hero p{color:#e6fff4;line-height:1.6}.service-hero .eyebrow{color:#bcebd7}.service-panel h2{font:800 19px Manrope,sans-serif;margin:0 0 16px}.service-form{display:grid;gap:12px}.service-form label{font-weight:700;font-size:14px}.service-form input,.service-form select{box-sizing:border-box;width:100%;margin-top:6px;padding:13px;border:1px solid #d7e2dc;border-radius:11px;font:inherit;background:#fff}.service-form .button{width:100%;border:0;cursor:pointer}.back-link{display:inline-block;color:#147a58;text-decoration:none;font-weight:700;margin:4px 0 16px}.form-result{margin-top:12px;padding:12px;border-radius:10px;background:#f0f8f4;color:#285744;font-size:14px;line-height:1.6;white-space:pre-wrap}.form-result:empty{display:none}.service-note{padding:13px;border-radius:12px;background:#f0f8f4;color:#285744;font-size:13px;line-height:1.6}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">F</span> FINA</a><button class="text-button" id="serviceSignOut" type="button">Sign out</button></header><main class="service-page"><a class="back-link" href="dashboard.html">← Back to wallet</a><section class="service-hero"><p class="eyebrow">BETTING SERVICE</p><h1>Betting wallet</h1><p>Choose a supported operator and enter the account details for a wallet funding request.</p></section><section class="service-panel"><h2>Enter service details</h2><form class="service-form" data-service-form data-endpoint="/api/services/betting"><label for="operator">Betting operator<select id="operator" name="operator" required><option value="">Select operator</option><option>SportyBet</option><option>Bet9ja</option><option>BetKing</option><option>1xBet</option><option>Other</option></select></label><label for="customerId">Customer / betting account ID<input id="customerId" name="customerId" type="text" autocomplete="off" placeholder="Enter customer ID" required></label><label for="amount">Amount (₦)<input id="amount" name="amount" type="number" min="50" max="100000" step="1" placeholder="Enter amount" required></label><button class="button button-dark" type="submit">Submit request</button><div id="serviceMessage" class="form-result" role="status" aria-live="polite"></div></form></section><p class="service-note">Your request is processed only after FINA's server confirms it. Review all details before submitting.</p></main><nav class="bottom-nav"><a href="index.html">Home</a><a class="active" href="dashboard.html">Wallet</a><a href="dashboard.html#activityList">Activity</a></nav><script src="config.js"></script><script src="service.js"></script><script>document.getElementById('serviceSignOut').addEventListener('click',()=>{localStorage.removeItem('fina_token');localStorage.removeItem('fina_user');location.href='index.html'});</script></body></html>
